<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="1000" height="700" fill="#0b0b0d"/>
  <text x="500" y="46" fill="#FF453A" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">12 点指向模式：12 点方向 vs 屏幕法线</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8E8E93"/>
    </marker>
  </defs>

  <!-- left: front view -->
  <g transform="translate(220,325)">
    <circle cx="0" cy="0" r="128" fill="#151518" stroke="#3A3A3C" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#FF453A"/>
    <text x="0" y="-145" fill="#FFFFFF" font-family="sans-serif" font-size="24" text-anchor="middle">12</text>
    <text x="0" y="164" fill="#C7C7CC" font-family="sans-serif" font-size="22" text-anchor="middle">6</text>
    <text x="150" y="8" fill="#C7C7CC" font-family="sans-serif" font-size="22" text-anchor="middle">3</text>
    <text x="-150" y="8" fill="#C7C7CC" font-family="sans-serif" font-size="22" text-anchor="middle">9</text>

    <line x1="0" y1="0" x2="0" y2="-105" stroke="#FF453A" stroke-width="5" marker-end="url(#arrowRed)"/>
    <text x="16" y="-70" fill="#FF453A" font-family="sans-serif" font-size="18">12 点方向</text>
    <text x="16" y="-46" fill="#8E8E93" font-family="sans-serif" font-size="14">表盘平面内</text>
    <text x="16" y="-28" fill="#8E8E93" font-family="sans-serif" font-size="14">从 6 点指向 12 点</text>

    <text x="0" y="210" fill="#8E8E93" font-family="sans-serif" font-size="16" text-anchor="middle">正视：屏幕朝向你</text>
  </g>

  <!-- right: side view -->
  <g>
    <!-- dial plane -->
    <line x1="520" y1="450" x2="760" y2="312" stroke="#3A3A3C" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- watch body edge-on, long axis along 12 direction -->
    <g transform="rotate(-30 640 380)">
      <rect x="540" y="357" width="200" height="46" rx="14" fill="#2C2C2E" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="540" y="357" width="12" height="46" rx="5" fill="#FF453A"/>
    </g>

    <!-- 12 edge label -->
    <text x="758" y="352" fill="#FFFFFF" font-family="sans-serif" font-size="17">12 点边缘</text>

    <!-- 12 direction to Moon -->
    <line x1="640" y1="380" x2="866" y2="250" stroke="#FF453A" stroke-width="5" marker-end="url(#arrowRed)"/>
    <text x="790" y="208" fill="#FF453A" font-family="sans-serif" font-size="18">12 点方向</text>
    <text x="790" y="230" fill="#FF453A" font-family="sans-serif" font-size="14">沿表盘面指出去</text>

    <!-- Moon -->
    <circle cx="888" cy="238" r="14" fill="#F2F2F7"/>
    <text x="908" y="230" fill="#F2F2F7" font-family="sans-serif" font-size="17">月球</text>

    <!-- screen normal toward eye -->
    <line x1="640" y1="380" x2="720" y2="519" stroke="#8E8E93" stroke-width="4" marker-end="url(#arrowGray)"/>
    <text x="735" y="510" fill="#8E8E93" font-family="sans-serif" font-size="16">屏幕法线</text>
    <text x="735" y="532" fill="#8E8E93" font-family="sans-serif" font-size="16">（朝眼睛）</text>
    <text x="700" y="570" fill="#FFFFFF" font-family="sans-serif" font-size="26">👁</text>

    <!-- back normal dashed -->
    <line x1="640" y1="380" x2="560" y2="242" stroke="#636366" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrowGray)"/>
    <text x="468" y="236" fill="#8E8E93" font-family="sans-serif" font-size="16">表背</text>
    <text x="468" y="258" fill="#8E8E93" font-family="sans-serif" font-size="14">（不是 12 点方向）</text>

    <text x="640" y="620" fill="#8E8E93" font-family="sans-serif" font-size="16" text-anchor="middle">侧视：12 点边缘抬向月球；屏幕朝向眼睛</text>
  </g>

  <text x="500" y="666" fill="#C7C7CC" font-family="sans-serif" font-size="17" text-anchor="middle">用 12 点边缘指目标：方向在表盘平面内，不是从屏幕里穿出去，也不是表背方向。</text>
</svg>
